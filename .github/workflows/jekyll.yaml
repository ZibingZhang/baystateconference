# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Rebuilds/redeploys as soon as that day's fetch finishes (see
  # fetch-schedule.yaml), so the site picks up the new schedule data right
  # away. Gated to only proceed on a successful fetch - see the build job's
  # `if`.
  workflow_run:
    workflows: ["Fetch Schedule Data"]
    types: [completed]

  # Backstop in case the fetch workflow's run event is ever missed - targets
  # the same midnight US Eastern time as fetch-schedule.yaml (see the
  # comment there on the two cron entries approximating the EDT/EST
  # boundary). Runs a few minutes after so it normally lands after the fetch
  # completes and just checks out that fresh commit.
  schedule:
    - cron: "10 4 * 3-10 *" # midnight EDT, Mar-Oct
    - cron: "10 5 * 11,12,1,2 *" # midnight EST, Nov-Feb

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    # For push/workflow_dispatch/schedule events there's no fetch conclusion
    # to check, so only the workflow_run event (triggered by Fetch Schedule
    # Data completing) needs gating - skip it if that fetch failed.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@086ffb1a2090c870a3f881cc91ea83aa4243d408 # v1.195.0
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
          working-directory: jekyll
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      # Pulls in the CSV published by fetch-schedule.yaml's orphan
      # `schedule-data` branch (a single commit, force-pushed fresh each
      # run - see that workflow). continue-on-error covers the case where
      # no fetch has ever succeeded yet and the branch doesn't exist, in
      # which case the copy step below is skipped and the build just has no
      # schedule data (schedule_page_generator.rb handles that - see its
      # comment).
      - name: Checkout schedule data
        id: schedule-data
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: schedule-data
          path: schedule-data
      - name: Copy schedule data
        if: steps.schedule-data.outcome == 'success'
        run: |
          mkdir -p jekyll/_data/schedule
          cp schedule-data/jekyll/_data/schedule/games.csv jekyll/_data/schedule/games.csv
      - name: Build with Jekyll
        working-directory: jekyll
        # Outputs to the './_site' directory (relative to working-directory) by default
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: jekyll/_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
