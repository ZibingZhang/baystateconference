# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Rebuilds/redeploys once a day so the site picks up that day's fetch (see
  # fetch-schedule.yaml, scheduled for 8:00 UTC) without waiting for an
  # unrelated content push. Deliberately just a second independent cron
  # rather than a workflow_run trigger off that workflow - the two are meant
  # to stay decoupled, this is only timed to usually run after it finishes.
  schedule:
    - cron: "45 8 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@086ffb1a2090c870a3f881cc91ea83aa4243d408 # v1.195.0
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
          working-directory: jekyll
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4
      # Restores the most recent schedule CSV saved by fetch-schedule.yaml.
      # No exact key ever matches (that workflow's run id differs from this
      # one's) so this always falls through to restore-keys, which resolves
      # to the newest cache entry with that prefix. If no fetch has ever
      # succeeded yet, this is a no-op and the build just has no schedule
      # data (schedule_page_generator.rb handles that - see its comment).
      - name: Restore cached schedule data
        uses: actions/cache/restore@v4
        with:
          path: jekyll/_data/schedule/games.csv
          key: schedule-data-${{ github.run_id }}
          restore-keys: |
            schedule-data-
      - name: Build with Jekyll
        working-directory: jekyll
        # Outputs to the './_site' directory (relative to working-directory) by default
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: jekyll/_site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
