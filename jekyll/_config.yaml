# Directories (matched against a page's own URL, without leading/trailing
# slashes) whose folder should start collapsed in the site map's file
# viewer. See _plugins/page_tree_generator.rb.
sitemap_collapsed_paths:
  - "swimming-diving/bsc/awards/all-stars"
  - "swimming-diving/bsc/schools"
  - "swimming-diving/emisca/awards"
  - "swimming-diving/miaa/qualifying-standards"

# Build settings
# theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
# exclude:
#   - .sass-cache/
#   - .jekyll-cache/
#   - gemfiles/
#   - Gemfile
#   - Gemfile.lock
#   - node_modules/
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

sass:
  quiet_deps: true
  silence_deprecations: [import]

# Minima skin selection. Available skins are:
#   Available skins:
#     * classic            Default, light color scheme.
#     * dark               Dark variant of the classic skin.
#     * auto               Adaptive skin based on the default classic and dark skins.
#     * solarized-light    Light variant of solarized color scheme.
#     * solarized-dark     Dark variant of solarized color scheme.
#     * solarized          Adaptive skin for solarized color scheme skins.
skin: classic

# Site navigation is now defined in _data/navigation.yml (supports hover
# subsections via a `children` list per item) instead of nav_pages here.

# Set to `true` to show excerpts on the homepage.
show_excerpts: false

# Minima date format.
#   The default value is "%b %d, %Y" (e.g. Nov 14, 2023).
#   Refer to https://shopify.github.io/liquid/filters/date/ for valid values.
# date_format: "%b-%d-%Y"

# Social Media Links
#   Renders icons based on an ordered list of entries. By default `icon` is
#   a Material Symbols icon name (https://fonts.google.com/icons); set
#   `brand: true` to render it as a Font Awesome Brands icon instead (id
#   without the `fa-` prefix, e.g. `github` -> `fa-github`), since Material
#   Symbols has no brand logos. Brand icons also get FA's `fa-lg` class -
#   without it an icon glyph's default line-height/vertical-align reads as
#   noticeably off-center in its box (verified on fa-github); fa-lg's
#   line-height/vertical-align combo is FA's own fix for that, not
#   something specific to this site.
#   Entry keys:
#     * title    Tooltip rendered on hovering over icon.
#     * icon     Icon id, see above.
#     * brand    Optional - true to render `icon` via Font Awesome Brands
#                instead of Material Symbols.
#     * url      Full URL of social profile.
social_links:
  - title: Source Code Repository at GitHub
    icon: github
    brand: true
    url: "https://github.com/ZibingZhang/baystateconference"

hide_site_feed_link: true
