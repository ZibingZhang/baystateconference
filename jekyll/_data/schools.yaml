# `school-name` is the school's actual name as it appears in the MIAA
# sectional/state results data (_data/swimming-diving/miaa/rankings) — in
# most cases that's just "<town> High School". `aliases` is only needed when
# a school's results have appeared under more than one name over the years
# (e.g. a defunct name like "Framingham North" from before a merger) — most
# schools don't need it at all.
#
# `instagram` is a flat list of that school's Instagram accounts, each
# tagged with whatever metadata determines where it shows up on the site -
# see _plugins/instagram_rows_filter.rb and _includes/instagram-rows.html.
# An entry needs only `url`; everything else is optional:
#   sport    a sport slug, or a list of slugs for one account shared across
#            several sports (e.g. track's distance/sprints groups) - absent
#            for the athletic department's own account(s), see `tags` below
#   gender   "girls" or "boys", when the sport splits by gender - absent
#            means the account covers the whole team for that sport (shown
#            once, above any gender-specific rows, not duplicated into both)
#   level    a team level, e.g. "Varsity"/"JV", when that distinction matters
#   tags     a free-form list for anything else worth labeling, e.g.
#            [distance]/[sprint] or [current]/[former] for a handle that
#            changed; [athletic-department] marks the department's own
#            account(s), shown on every page regardless of sport
