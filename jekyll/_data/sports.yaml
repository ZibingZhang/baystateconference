# Sports shown as cards on /sports/. Add an entry here as each new sport's
# section is built out. `icon` is a Material Symbols (Outlined) icon name:
# https://fonts.google.com/icons
#
# For each sport, _plugins/sport_governing_body_page_generator.rb generates
# its About > MIAA and About > NFHS pages (/<sport>/miaa/, /<sport>/nfhs/)
# straight from this file - there's no miaa/index.md or nfhs/index.md to
# hand-write per sport. A sport gets a page for a governing body only if it
# has an `external_links` entry for that body below (e.g. Rugby has no
# `nfhs` key since NFHS doesn't sanction it, so no /sports/rugby/organizations/nfhs/ is built).
#
# Fields a sport entry can set, per governing body (`miaa` and/or `nfhs`):
#
#   external_links.<body>   Required to generate that body's page at all.
#                            A list of {title, url} pairs rendered under
#                            "Resources" - typically just that body's own
#                            website, but a sport can list more than one
#                            (e.g. Lacrosse links both the NFHS boys' and
#                            girls' pages, since NFHS doesn't have a
#                            combined one).
#
#   internal_links.<body>   Optional. A list of {title, url} pairs to pages
#                            within this site (e.g. a qualifying-standards
#                            or rule-changes page), rendered under
#                            "Directory" below Resources. Omit if the sport
#                            has no such subpages yet.
#
#   page_content.about.<body>
#                            Optional escape hatch for when the standard
#                            paragraph + Resources + Directory isn't enough
#                            and a sport's page needs extra freeform content
#                            (more Markdown/Liquid, appended at the very end
#                            of the page). Not currently used by any sport -
#                            reach for internal_links first if what you need
#                            is just another link.
- title: Baseball
  url: /sports/baseball/
  icon: sports_baseball
  external_links:
    miaa:
      - title: MIAA Website
        url: https://www.miaa.net/baseball
    nfhs:
      - title: NFHS Website
        url: https://www.nfhs.org/sports/baseball

