<div class="file-browser" data-page-url="{{ page.url }}" data-baseurl="{{ site.baseurl }}" data-s3-bucket-root="{{ site.s3_bucket_root }}" data-src="{{ '/assets/data/swimming-diving/file-browser/' | append: include.data | append: '/index.json' | relative_url }}">
  <div class="file-browser-search">
    <div class="file-browser-nav">
      <button type="button" class="file-browser-nav-btn file-browser-nav-back" aria-label="Back" title="Back" disabled>
        <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
      </button>
      <button type="button" class="file-browser-nav-btn file-browser-nav-forward" aria-label="Forward" title="Forward" disabled>
        <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
      </button>
    </div>
    <span class="material-symbols-outlined" aria-hidden="true">search</span>
    <input type="text" class="file-browser-search-input" placeholder="Search files…" aria-label="Search files">
    <button type="button" class="file-browser-sort-toggle" aria-pressed="false" aria-label="Sort Z to A" title="Sort Z to A">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_upward</span>
    </button>
    <button type="button" class="file-browser-select-toggle" aria-pressed="false" aria-label="Select files to download" title="Select files to download">
      <span class="material-symbols-outlined" aria-hidden="true">download</span>
    </button>
    <button type="button" class="file-browser-shortcuts-toggle" aria-haspopup="true" aria-expanded="false" aria-label="Keyboard shortcuts" title="Keyboard shortcuts">
      <span class="material-symbols-outlined" aria-hidden="true">keyboard</span>
    </button>
    <div class="file-browser-shortcuts-popover" role="dialog" aria-label="Keyboard shortcuts" hidden>
      <ul>
        <li><kbd>/</kbd> Focus search</li>
        <li><kbd>&uarr;</kbd><kbd>&darr;</kbd> Move through list</li>
        <li><kbd>&larr;</kbd><kbd>&rarr;</kbd> Back / forward</li>
        <li><kbd>Enter</kbd> Open selected</li>
        <li><kbd class="file-browser-mod-key">Ctrl</kbd><kbd>&uarr;</kbd><kbd class="file-browser-mod-key">Ctrl</kbd><kbd>&darr;</kbd> Jump to first/last</li>
      </ul>
    </div>
  </div>
  <ul class="file-browser-tags" hidden></ul>
  <div class="file-browser-select-bar" hidden>
    <span class="file-browser-select-count">0 selected</span>
    <button type="button" class="file-browser-select-download" disabled>
      <span class="material-symbols-outlined" aria-hidden="true">folder_zip</span> Download ZIP
    </button>
  </div>
  <div class="file-browser-loading loading-indicator">
    <span class="material-symbols-outlined icon-spin" aria-hidden="true">progress_activity</span>
    <span>Loading files…</span>
  </div>
  <ul class="file-browser-list" hidden></ul>
  <p class="file-browser-empty" hidden>No files match your search.</p>
  <p class="file-browser-error" hidden>Unable to load files. Please try again later.</p>
  <p class="file-browser-count" hidden></p>
  <p class="file-browser-zip-status" aria-live="polite" hidden></p>
</div>

<script src="{{ '/assets/js/vendor/jszip.min.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/fuzzy-score.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/search-controls.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/copy-link.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/file-browser.js' | relative_url }}" defer></script>
