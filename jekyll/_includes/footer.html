<link id="material-symbols-stylesheet" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_downward,arrow_upward,check,chevron_left,chevron_right,close,code,construction,description,directions_run,download,folder,folder_zip,footprint,insert_drive_file,keyboard,link,location_on,open_in_new,padel,picture_as_pdf,pool,progress_activity,search,settings,sports_baseball,sports_basketball,sports_football,sports_golf,sports_gymnastics,sports_hockey,sports_kabaddi,sports_rugby,sports_soccer,sports_tennis,sports_volleyball,tab,timer">
<!-- Brand marks only (e.g. the GitHub logo) - Material Symbols has none. `fontawesome.css` is the shared, font-free base CSS FA7 requires alongside any per-style sheet (it's what defines the fa-lg sizing/centering utility used in social.html); `brands.css` is the brands-only icon set, much smaller than the full FA bundle. -->
<link id="fa-base-stylesheet" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.0.0/css/fontawesome.css">
<link id="fa-brands-stylesheet" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.0.0/css/brands.css">

<footer class="site-footer h-card">
  <data class="u-url" value="{{ '/' | relative_url }}"></data>

  <div class="wrapper">

    <div class="footer-col-wrapper">
      <div class="footer-col">
      {%- if site.author %}
        <ul class="contact-list">
          {% if site.author.name -%}
            <li class="p-name">{{ site.author.name | escape }}</li>
          {% endif -%}
          {% if site.author.email -%}
            <li><a class="u-email" href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></li>
          {%- endif %}
        </ul>
      {%- endif %}
      </div>
      <div class="footer-col">
        <p>{{ site.description | escape }}</p>
      </div>
    </div>

    <div class="social-links">
      {%- include social.html -%}
    </div>

  </div>

</footer>
