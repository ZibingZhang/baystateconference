<header class="site-header">

  <div class="wrapper">
    <a class="settings-link" href="{{ '/settings/' | relative_url }}" aria-label="Appearance settings">
      <span class="material-symbols-outlined" aria-hidden="true">settings</span>
    </a>

    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    {%- assign nav_name = page.nav | default: "sports" -%}
    {%- assign nav = site.data.navigation[nav_name] -%}

    {%- unless nav == empty %}
      <nav class="site-nav">
        <input type="checkbox" id="nav-trigger" />
        <label for="nav-trigger">
          <span class="menu-icon"></span>
        </label>

        {% include nav-items.html nav=nav %}
      </nav>
    {%- endunless %}
  </div>
</header>
